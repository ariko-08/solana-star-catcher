<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solana Star Catcher</title>
<style>
  :root {
    --purple: #9945FF;
    --green: #14F195;
    --bg: #0d0818;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 900px;
    margin: 0 auto;
  }
  header {
    padding: 12px 16px 10px;
    text-align: center;
    background: linear-gradient(180deg, rgba(153,69,255,.35), rgba(153,69,255,0));
  }
  h1 {
    font-size: clamp(22px, 5.5vw, 36px);
    letter-spacing: .02em;
    background: linear-gradient(90deg, var(--purple), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
  }
  .stat {
    min-width: 120px;
    padding: 6px 14px;
    border-radius: 12px;
    border: 2px solid var(--purple);
    background: rgba(153,69,255,.15);
    font-size: 14px;
  }
  .stat b {
    display: block;
    font-size: 24px;
    color: var(--green);
    font-variant-numeric: tabular-nums;
  }
  .stat.warn { border-color: #ff4d6d; }
  .stat.warn b { color: #ff4d6d; }
  #field {
    position: relative;
    flex: 1;
    margin: 0 10px 10px;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid rgba(153,69,255,.6);
    background:
      radial-gradient(circle at 20% 15%, rgba(153,69,255,.25), transparent 50%),
      radial-gradient(circle at 80% 85%, rgba(20,241,149,.15), transparent 50%),
      #120a22;
    cursor: pointer;
  }
  .bgstar {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: .5;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 50% { opacity: .1; } }
  .star {
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    will-change: transform;
    touch-action: manipulation;
  }
  .star svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px currentColor); pointer-events: none; }
  .pop {
    position: absolute;
    font-weight: 800;
    font-size: 22px;
    pointer-events: none;
    animation: pop .6s ease-out forwards;
  }
  @keyframes pop {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-40px) scale(1.4); }
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    background: rgba(13,8,24,.82);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: clamp(24px, 6vw, 36px); color: var(--green); }
  .overlay p { color: #d9c8ff; line-height: 1.7; font-size: 15px; }
  .big { font-size: 64px; font-weight: 800; color: var(--green); line-height: 1; }
  .best { color: var(--purple); font-weight: 700; }
  button {
    font: inherit;
    font-size: 20px;
    font-weight: 800;
    padding: 14px 40px;
    border: none;
    border-radius: 999px;
    color: #12081f;
    background: linear-gradient(90deg, var(--purple), var(--green));
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(153,69,255,.5);
    transition: transform .1s;
  }
  button:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Solana Star Catcher</h1>
    <div class="stats">
      <div class="stat">スコア<b id="score">0</b></div>
      <div class="stat" id="timeBox">残り時間<b id="time">30</b></div>
    </div>
  </header>

  <div id="field">
    <div class="overlay" id="startScreen">
      <h2>星をつかまえよう！</h2>
      <p>落ちてくる星をタップ／クリック。<br>
        <span style="color:#14F195">緑の星</span>＝1点、<span style="color:#c79bff">紫の星</span>＝3点（小さくて速い！）<br>
        制限時間は30秒です。</p>
      <button id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="endScreen">
      <h2>タイムアップ！</h2>
      <div class="big" id="finalScore">0</div>
      <p>ベストスコア：<span class="best" id="bestScore">0</span></p>
      <button id="retryBtn">もう一度</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const GAME_SECONDS = 30;
  const field = document.getElementById("field");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const timeBox = document.getElementById("timeBox");
  const startScreen = document.getElementById("startScreen");
  const endScreen = document.getElementById("endScreen");
  const finalScoreEl = document.getElementById("finalScore");
  const bestScoreEl = document.getElementById("bestScore");

  let score = 0;
  let best = 0;
  let endTime = 0;
  let running = false;
  let stars = [];
  let lastFrame = 0;
  let lastSpawn = 0;
  let rafId = 0;

  // 背景の星
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("div");
    s.className = "bgstar";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    field.appendChild(s);
  }

  const STAR_SVG =
    '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.6 5.6 21.2 7 14l-5.3-5 7.2-.9z"/></svg>';

  function spawnStar() {
    const rect = field.getBoundingClientRect();
    const golden = Math.random() < 0.2; // 紫＝高得点
    const size = golden ? 38 + Math.random() * 10 : 52 + Math.random() * 24;
    const el = document.createElement("div");
    el.className = "star";
    el.style.width = el.style.height = size + "px";
    el.style.color = golden ? "#9945FF" : "#14F195";
    el.innerHTML = STAR_SVG;

    const star = {
      el: el,
      x: Math.random() * Math.max(10, rect.width - size),
      y: -size,
      size: size,
      speed: (golden ? 260 : 150) + Math.random() * 90 + (GAME_SECONDS - remaining()) * 3,
      rot: Math.random() * 360,
      spin: (Math.random() - 0.5) * 240,
      points: golden ? 3 : 1,
      color: golden ? "#c79bff" : "#14F195",
      alive: true
    };

    const hit = function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (!running || !star.alive) return;
      catchStar(star);
    };
    el.addEventListener("pointerdown", hit);

    field.appendChild(el);
    stars.push(star);
    render(star);
  }

  function render(s) {
    s.el.style.transform =
      "translate(" + s.x + "px," + s.y + "px) rotate(" + s.rot + "deg)";
  }

  function catchStar(s) {
    s.alive = false;
    score += s.points;
    scoreEl.textContent = score;

    const pop = document.createElement("div");
    pop.className = "pop";
    pop.textContent = "+" + s.points;
    pop.style.color = s.color;
    pop.style.left = (s.x + s.size / 2 - 12) + "px";
    pop.style.top = (s.y) + "px";
    field.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 600);

    s.el.remove();
  }

  function remaining() {
    return Math.max(0, (endTime - performance.now()) / 1000);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    const rect = field.getBoundingClientRect();
    const left = remaining();
    timeEl.textContent = Math.ceil(left);
    timeBox.classList.toggle("warn", left <= 5);

    if (left <= 0) {
      endGame();
      return;
    }

    // 生成間隔（時間が進むほど少し短く）
    const interval = 650 - (GAME_SECONDS - left) * 8;
    if (now - lastSpawn > interval) {
      spawnStar();
      lastSpawn = now;
    }

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      if (!s.alive) { stars.splice(i, 1); continue; }
      s.y += s.speed * dt;
      s.rot += s.spin * dt;
      if (s.y > rect.height) {
        s.el.remove();
        stars.splice(i, 1);
      } else {
        render(s);
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    stars.forEach(function (s) { s.el.remove(); });
    stars = [];
    score = 0;
    scoreEl.textContent = "0";
    timeEl.textContent = GAME_SECONDS;
    timeBox.classList.remove("warn");
    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");

    running = true;
    const now = performance.now();
    endTime = now + GAME_SECONDS * 1000;
    lastFrame = now;
    lastSpawn = now - 1000;
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(rafId);
    timeEl.textContent = "0";
    stars.forEach(function (s) { s.el.remove(); });
    stars = [];
    if (score > best) best = score;
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    endScreen.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);
})();
</script>
</body>
</html>
